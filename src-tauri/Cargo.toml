[package]
name = "pomodoro-app"
version = "0.1.0"
description = "一轮番茄钟"
authors = ["Future"]
edition = "2021"

[lib]
name = "pomodoro_app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
